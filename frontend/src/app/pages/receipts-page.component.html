<section>
  <nb-card>
    <nb-card-body>
      <div class="toolbar">
        <div>
          <h4 class="page-title">Recibos</h4>
          <p class="page-sub">Emissao</p>
        </div>

        <div class="toolbar-actions">
          <div class="search-group">
            <input
              nbInput
              fullWidth
              [(ngModel)]="search"
              name="search"
              placeholder="Buscar por pagador, recebedor ou documento"
              (keyup.enter)="load()"
            />
            <button nbButton status="primary" type="button" (click)="load()">Buscar</button>
          </div>
          <button nbButton status="success" type="button" (click)="openCreate()">Novo recibo</button>
        </div>
      </div>

      <nb-alert *ngIf="error" status="danger" (close)="error = ''">{{ error }}</nb-alert>
      <nb-alert *ngIf="loading" status="info">Carregando recibos...</nb-alert>

      <div class="table-wrap">
        <table class="nb-table">
          <thead>
            <tr>
              <th scope="col">Data</th>
              <th scope="col">Pagador</th>
              <th scope="col">Recebedor</th>
              <th scope="col">Valor</th>
              <th scope="col">Layout</th>
              <th scope="col">Acoes</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let receipt of receipts; trackBy: trackById">
              <td>{{ receipt.issueDate }}</td>
              <td>{{ receipt.payerName }}</td>
              <td>{{ receipt.receiverName }}</td>
              <td>{{ receipt.amount | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}</td>
              <td>{{ templateLabel(receipt.template) }}</td>
              <td>
                <div class="actions">
                  <button nbButton ghost size="small" type="button" (click)="editReceipt(receipt)">Editar</button>
                  <button nbButton ghost status="primary" size="small" type="button" [disabled]="!receipt.id" (click)="preview(receipt.id, receipt.template ?? undefined)">Preview</button>
                  <button nbButton ghost status="danger" size="small" type="button" (click)="remove(receipt.id)">Excluir</button>
                </div>
              </td>
            </tr>
            <tr *ngIf="!receipts.length">
              <td colspan="6" class="empty">Nenhum recibo encontrado.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </nb-card-body>
  </nb-card>
</section>
