<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="card shadow-lg border-0 rounded-4" style="max-width: 420px; width: 100%;">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <p class="eyebrow text-secondary mb-1">IwaRecibos 2.0</p>
        <h2 class="fw-bold mb-2">Entrar</h2>
        <p class="text-secondary mb-0">Acesse sua conta para continuar</p>
      </div>

      <div class="d-grid gap-3">
        <button
          type="button"
          class="btn btn-primary btn-lg"
          (click)="loginWithKeycloak()"
          [disabled]="loading">
          @if (loading) {
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          }
          Entrar com Keycloak
        </button>
      </div>

      <div class="text-center mt-4">
        <small class="text-secondary">
          Voce sera redirecionado para o Keycloak para autenticacao.
        </small>
      </div>
    </div>
  </div>
</div>
