<div class="login-wrapper">
  <nb-card class="login-card" size="large">
    <nb-card-body>
      <p class="stat-label">IwaRecibos 2.0</p>
      <h4>Entrar</h4>
      <p class="page-sub">Acesse sua conta para continuar</p>

      <button
        nbButton
        status="primary"
        size="large"
        fullWidth
        (click)="loginWithAuthentik()"
        [disabled]="loading"
        [nbSpinner]="loading"
        nbSpinnerStatus="primary"
        nbSpinnerSize="large"
      >
        Entrar com Authentik
      </button>

      <p class="login-hint">Voce sera redirecionado para o Authentik para autenticacao.</p>
    </nb-card-body>
  </nb-card>
</div>
