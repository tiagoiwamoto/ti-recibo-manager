<section>
  <nb-card>
    <nb-card-body>
      <div class="toolbar">
        <div>
          <h4 class="page-title">Clientes</h4>
          <p class="page-sub">Cadastro</p>
        </div>

        <div class="toolbar-actions">
          <div class="search-group">
            <input
              nbInput
              fullWidth
              [(ngModel)]="search"
              name="search"
              placeholder="Buscar por nome ou documento"
              (keyup.enter)="load()"
            />
            <button nbButton status="primary" type="button" (click)="load()">Buscar</button>
          </div>
          <button nbButton status="success" type="button" (click)="openCreate()">Novo cliente</button>
        </div>
      </div>

      <nb-alert *ngIf="error" status="danger" (close)="error = ''">{{ error }}</nb-alert>
      <nb-alert *ngIf="loading" status="info">Carregando clientes...</nb-alert>

      <div class="table-wrap">
        <table class="nb-table">
          <thead>
            <tr>
              <th scope="col">Nome</th>
              <th scope="col">Documento</th>
              <th scope="col">Cidade</th>
              <th scope="col">Acoes</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let client of clients; trackBy: trackById">
              <td>{{ client.name }}</td>
              <td>{{ client.documentType }} {{ client.document }}</td>
              <td>{{ client.city }}</td>
              <td>
                <div class="actions">
                  <button nbButton ghost size="small" type="button" (click)="editClient(client)">Editar</button>
                  <button nbButton ghost status="danger" size="small" type="button" (click)="remove(client.id)">Excluir</button>
                </div>
              </td>
            </tr>
            <tr *ngIf="!clients.length">
              <td colspan="4" class="empty">Nenhum cliente encontrado.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </nb-card-body>
  </nb-card>
</section>
