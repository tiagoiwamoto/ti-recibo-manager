spring.application.name=iwarecibos-api

# ----------------------------------------------
# Database Configuration (PostgreSQL)
# ----------------------------------------------
spring.datasource.url=${POSTGRES_URI:jdbc:postgresql://localhost:5432/recibomanager}
spring.datasource.username=${POSTGRES_USERNAME:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Schema managed by JPA (ddl-auto=update); SQL init disabled
spring.sql.init.mode=never

server.port=8080

management.endpoints.web.exposure.include=health,info

# ----------------------------------------------
# CORS Configuration
# ----------------------------------------------
app.frontend.allowed-origin-patterns=${APP_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://localhost:*,https://recibomanager.kamehouse.com.br}

# ----------------------------------------------
# Authentik / OAuth2 Resource Server Configuration
# ----------------------------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTHENTIK_ISSUER_URI:https://auth.kamehouse.com.br/application/o/tirecibomanager/}
# OIDC / OAuth2 Resource Server (Authentik)
app.security.oauth2.resource-id=${KEYCLOAK_RESOURCE_ID:7TVtDnk6Js4g23yuLA2EOV4An0RIePtoLoBUqEAm}
