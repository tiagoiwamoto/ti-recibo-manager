spring.application.name=iwarecibos-api

# Use H2 file-based database for development
spring.datasource.url=jdbc:h2:file:./iwarecibos-web;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

# Initialize schema/data from resources/schema.sql and data.sql
spring.sql.init.mode=always

# JPA settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

server.port=8080

management.endpoints.web.exposure.include=health,info

# ----------------------------------------------
# CORS Configuration
# ----------------------------------------------
app.frontend.allowed-origin-patterns=${APP_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://localhost:*,https://recibos.kamehouse.com.br}

# ----------------------------------------------
# Keycloak / OAuth2 Resource Server Configuration
# ----------------------------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:https://keycloak.kamehouse.com.br/realms/tirecibomanager}
app.security.oauth2.resource-id=${KEYCLOAK_RESOURCE_ID:tirecibomanager-frontend}
