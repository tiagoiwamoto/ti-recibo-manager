spring.application.name=iwarecibos-api

# Use H2 file-based database for development
spring.datasource.url=jdbc:h2:file:./iwarecibos-web;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

# Initialize schema/data from resources/schema.sql and data.sql
spring.sql.init.mode=always

# JPA settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

server.port=8080

management.endpoints.web.exposure.include=health,info
