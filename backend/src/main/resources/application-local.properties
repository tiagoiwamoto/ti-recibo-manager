# ----------------------------------------------
# "local" profile -> HTTPS using the Let's Encrypt certificate
# ----------------------------------------------
# The PEM files are produced/renewed by Let's Encrypt and placed under
# /certificates (see backend/copy-certificates.sh and Dockerfile). The very same
# fullchain.pem / privkey.pem are also consumed by the Angular dev server, so
# backend and frontend share a single certificate.
#
# Run with: -Dspring.profiles.active=local -Dserver.port=8443

server.ssl.enabled=true
server.ssl.certificate=${SSL_CERT_PATH:/certificates/fullchain.pem}
server.ssl.certificate-private-key=${SSL_CERT_KEY_PATH:/certificates/privkey.pem}
